name: Gerar app Android

# Como usar: no GitHub, aba "Actions" > "Gerar app Android" > "Run workflow".
# Em uns 8 a 12 minutos o app (apep.apk) aparece em "Releases", com link fixo de download.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Gerar o site (com as chaves do Supabase)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Criar o projeto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          # cada build ganha um número de versão maior, para o celular aceitar como atualização
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar o app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/apep.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p 4 "$UNSIGNED" "$RUNNER_TEMP/alinhado.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/apep.p12" --ks-pass env:KEYSTORE_PASS --ks-key-alias apep --out apep.apk "$RUNNER_TEMP/alinhado.apk"
          "$BT/apksigner" verify apep.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: App APEP (versão ${{ github.run_number }})
          files: apep.apk
          make_latest: true
